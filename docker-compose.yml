services:
  fire-detection:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    volumes:
      - ./data:/srv/data
      # mount folders with videos you want to browse from the UI:
      # - /path/to/videos:/videos:ro
    # for a webcam: devices: ["/dev/video0:/dev/video0"]
    restart: unless-stopped
