<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fire & Smoke Detection</title>
<style>
  :root{--bg:#0f1115;--panel:#181b22;--line:#262a33;--fg:#e6e8ee;--muted:#8b93a7;--fire:#ff5a1f;--smoke:#9aa4b5;--ok:#35c26b;--bad:#ff3b3b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
  header h1{font-size:16px;margin:0;letter-spacing:.02em}
  header h1 span{color:var(--fire)}
  form{display:flex;gap:8px;flex:1;max-width:900px}
  input[type=text]{flex:1;background:#0b0d12;border:1px solid var(--line);color:var(--fg);padding:8px 10px;border-radius:6px;font-size:14px}
  input[type=text]::placeholder{color:#5b6274}
  button{background:#2a62ff;color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:600}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  button.danger{background:transparent;border:1px solid #4a2626;color:#ff8a8a}
  label.chk{display:flex;align-items:center;gap:6px;color:var(--muted);white-space:nowrap}
  main{display:grid;grid-template-columns:1fr 340px;gap:16px;padding:16px 20px;min-height:calc(100vh - 57px)}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px;align-content:start}
  .cam{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:box-shadow .2s}
  .cam.alarm{border-color:var(--bad);box-shadow:0 0 0 3px rgba(255,59,59,.35);animation:pulse 1s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,59,59,.15)}}
  .cam img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#000}
  .cam .bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
  .cam .name{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex-shrink:0}
  .dot.on{background:var(--ok)} .dot.off{background:var(--bad)}
  .meta{color:var(--muted);font-size:12px;white-space:nowrap}
  .tag{font-size:11px;padding:2px 7px;border-radius:999px;font-weight:700;text-transform:uppercase}
  .tag.fire{background:rgba(255,90,31,.2);color:var(--fire)} .tag.smoke{background:rgba(154,164,181,.2);color:var(--smoke)}
  aside{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;max-height:calc(100vh - 90px);position:sticky;top:73px}
  aside h2{font-size:13px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between}
  #events{overflow:auto;padding:8px}
  .ev{display:flex;gap:10px;padding:8px;border-radius:8px;cursor:pointer}
  .ev:hover{background:#1f232c}
  .ev img{width:96px;height:54px;object-fit:cover;border-radius:4px;background:#000;flex-shrink:0}
  .ev .t{font-size:12px;color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:40px 10px}
  #toast{position:fixed;right:20px;bottom:20px;background:var(--bad);color:#fff;padding:12px 16px;border-radius:8px;font-weight:700;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:10}
  #lightbox img{max-width:92vw;max-height:92vh;border-radius:8px}
  @media(max-width:900px){main{grid-template-columns:1fr}aside{position:static;max-height:400px}}
</style>
</head>
<body>
<header>
  <h1>🔥 Fire <span>&amp;</span> Smoke Detection</h1>
  <form id="add">
    <input type="text" id="src" placeholder="rtsp://user:pass@host:554/stream  |  rtmp://host/live/key  |  https://.../playlist.m3u8  |  /path/to/video.mp4  |  0 (webcam)" required>
    <input type="text" id="name" placeholder="Name (optional)" style="max-width:180px">
    <label class="chk"><input type="checkbox" id="rec"> record</label>
    <button type="submit">Add source</button>
  </form>
  <button class="ghost" id="mute" title="Toggle alert sound">🔔</button>
</header>
<main>
  <div id="grid"><div class="empty" id="nosrc">No sources yet. Add an RTSP/RTMP/HTTP stream, a file path, or a webcam index above.</div></div>
  <aside>
    <h2>Alerts <span id="evcount"></span></h2>
    <div id="events"><div class="empty">No alerts yet</div></div>
  </aside>
</main>
<div id="toast"></div>
<div id="lightbox" onclick="this.style.display='none'"><img id="lbimg"></div>
<script>
const grid=document.getElementById('grid'), evbox=document.getElementById('events'), toast=document.getElementById('toast');
const cams={}; let muted=localStorage.getItem('muted')==='1'; let evcount=0;
document.getElementById('mute').textContent=muted?'🔕':'🔔';
document.getElementById('mute').onclick=()=>{muted=!muted;localStorage.setItem('muted',muted?'1':'0');document.getElementById('mute').textContent=muted?'🔕':'🔔';};

function beep(){ if(muted) return; try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.35);}catch(e){} }

function card(s){
  const el=document.createElement('div');el.className='cam';el.id='cam-'+s.id;
  el.innerHTML=`<img src="/api/sources/${s.id}/stream" alt="${s.name}">
    <div class="bar"><span class="dot"></span><span class="name" title="${s.source}">${s.name}</span>
    <span class="tags"></span><span class="meta"></span>
    <button class="danger" title="Remove">✕</button></div>`;
  el.querySelector('button').onclick=async()=>{ if(!confirm('Remove '+s.name+'?'))return; await fetch('/api/sources/'+s.id,{method:'DELETE'}); el.remove(); delete cams[s.id]; toggleEmpty(); };
  grid.appendChild(el); cams[s.id]=el; toggleEmpty(); return el;
}
function toggleEmpty(){ document.getElementById('nosrc').style.display=Object.keys(cams).length?'none':'block'; }
function render(sources){
  const seen=new Set();
  for(const s of sources){ seen.add(s.id); const el=cams[s.id]||card(s);
    el.classList.toggle('alarm',s.alarm);
    const d=el.querySelector('.dot'); d.className='dot '+(s.connected?'on':(s.ended?'':'off'));
    el.querySelector('.meta').textContent=(s.resolution?s.resolution+' · ':'')+(s.connected?s.fps+' fps':(s.ended?'ended':(s.error||'connecting…')))+(s.recording?' · REC':'');
    const labels=[...new Set(s.detections.map(x=>x.label))];
    el.querySelector('.tags').innerHTML=labels.map(l=>`<span class="tag ${l}">${l}</span>`).join(' ');
  }
  for(const id of Object.keys(cams)) if(!seen.has(id)){cams[id].remove();delete cams[id];}
  toggleEmpty();
}
function addEvent(e,prepend=true){
  if(evbox.querySelector('.empty')) evbox.innerHTML='';
  const el=document.createElement('div');el.className='ev';
  const t=new Date(e.timestamp);
  el.innerHTML=`<img src="${e.snapshot}" loading="lazy"><div><div>${e.labels.map(l=>`<span class="tag ${l}">${l}</span>`).join(' ')} <b>${(e.max_confidence*100).toFixed(0)}%</b></div><div>${e.source_name}</div><div class="t">${t.toLocaleString()}</div></div>`;
  el.onclick=()=>{document.getElementById('lbimg').src=e.snapshot;document.getElementById('lightbox').style.display='flex';};
  prepend?evbox.prepend(el):evbox.appendChild(el);
  evcount++; document.getElementById('evcount').textContent=evcount;
}
function showToast(e){ toast.textContent=`🚨 ${e.labels.join(' + ').toUpperCase()} detected on ${e.source_name}`; toast.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>toast.style.display='none',6000); beep(); }

document.getElementById('add').onsubmit=async ev=>{
  ev.preventDefault();
  const body={source:document.getElementById('src').value.trim(),name:document.getElementById('name').value.trim(),record:document.getElementById('rec').checked};
  const r=await fetch('/api/sources',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){alert('Failed: '+(await r.text()));return;}
  document.getElementById('src').value='';document.getElementById('name').value='';document.getElementById('rec').checked=false;
  render(await (await fetch('/api/sources')).json());
};

async function init(){
  render(await (await fetch('/api/sources')).json());
  const evs=await (await fetch('/api/events?limit=100')).json();
  for(const e of evs) addEvent(e,false);
  connect();
}
function connect(){
  const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/events');
  ws.onmessage=m=>{const d=JSON.parse(m.data); if(d.type==='alert'){addEvent(d.event);showToast(d.event);} else if(d.sources){render(d.sources);} };
  ws.onclose=()=>setTimeout(connect,2000);
}
init();
</script>
</body>
</html>
